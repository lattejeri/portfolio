<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Diffused patches of #F1EFE8 -->
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.945  0 0 0 0 0.937  0 0 0 0 0.910  2.4 0 0 0 -0.9"/>
  </filter>
  <!-- Fine grain of #888780 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.533  0 0 0 0 0.529  0 0 0 0 0.502  0.28 0 0 0 -0.1"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#cloud)"/>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
