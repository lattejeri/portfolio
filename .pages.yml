# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Paths must match `base` in astro.config.mjs. The first source is the default for image fields.
media:
  - name: images
    label: Images
    input: public/media
    output: /portfolio/media
  - name: icons
    label: Icons
    input: public/icons
    output: /portfolio/icons
    extensions: [svg]

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text }
      - { name: date, label: Date, type: date, required: true }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: body, label: Body, type: rich-text }

  - name: work
    label: Work
    type: collection
    path: src/content/work
    filename: "{primary}.md"
    view:
      fields: [title, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: byline, label: Byline, type: text, description: "Links: [text](https://url)" }
      - { name: draft, label: Draft, type: boolean, default: false }
      - name: blocks
        label: Blocks
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text (800 wide)
            fields:
              - name: body
                label: Text
                type: rich-text
                options:
                  format: html
          - name: image
            label: Full-width image
            fields:
              - { name: src, label: Image, type: image, required: true }
              - { name: alt, label: Image description (alt text), type: string }
              - { name: caption, label: Caption, type: string }
              - { name: framed, label: Rounded corners, type: boolean, default: false }
          - name: imageInline
            label: Image (800 wide, with text)
            fields:
              - { name: src, label: Image, type: image, required: true }
              - { name: alt, label: Image description (alt text), type: string }
              - { name: caption, label: Caption, type: string }
              - { name: framed, label: Rounded corners, type: boolean, default: false }
          - name: imageWide
            label: Image (wide, max 1200)
            fields:
              - { name: src, label: Image, type: image, required: true }
              - { name: alt, label: Image description (alt text), type: string }
              - { name: caption, label: Caption, type: string }
              - { name: framed, label: Rounded corners, type: boolean, default: false }
          - name: columns2
            label: 2-column images
            fields:
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners, type: boolean, default: false }
          - name: columns3
            label: 3-column images
            fields:
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners, type: boolean, default: false }
          - name: carousel
            label: Carousel (swipe through images)
            fields:
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners, type: boolean, default: false }
          - name: embed
            label: Embed (web page in a frame, up to 1200 wide)
            fields:
              - { name: src, label: Address, type: string, required: true, description: "e.g. /portfolio/styleguides/research-hq/index.html" }
              - { name: title, label: Title (for screen readers), type: string, default: Embedded content }
              - { name: height, label: Height (px), type: number, default: 800 }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: title, label: Site title, type: string, required: true }
      - { name: description, label: Description, type: string }
      - { name: intro, label: Homepage title, type: text }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: byline, label: Homepage byline, type: text, description: "Links: [text](https://url)" }

  - name: grid
    label: Homepage grid
    type: file
    path: src/data/grid.json
    format: json
    fields:
      - name: items
        label: Tiles
        type: object
        list: true
        fields:
          - name: kind
            label: Kind
            type: select
            required: true
            default: work
            options:
              values: [work, doodle, text]
          - name: size
            label: Size (columns x rows)
            type: select
            description: Doodles are always 2x1. Text cards are 1x1 or 2x1.
            default: 1x1
            options:
              values: [1x1, 2x1, 2x2]
          - { name: title, label: Title, type: string }
          - { name: text, label: Card text (text cards only), type: text }
          - name: icon
            label: Icon (text cards only)
            type: image
            description: Pick from the Icons folder (SVG). Upload new icons there.
            options:
              media: icons
          - name: iconColour
            label: Icon colour
            type: select
            description: Leave empty to keep the icon's own colours.
            options:
              placeholder: Original colours
              values:
                - { name: data-line, label: "Data · line" }
                - { name: data-deep, label: "Data · deep" }
                - { name: people-line, label: "People · line" }
                - { name: people-deep, label: "People · deep" }
                - { name: system-line, label: "System · line" }
                - { name: system-deep, label: "System · deep" }
                - { name: friction-line, label: "Friction · line" }
                - { name: friction-deep, label: "Friction · deep" }
                - { name: focus-line, label: "Focus · line" }
                - { name: focus-deep, label: "Focus · deep" }
                - { name: structure-line, label: "Structure · line" }
                - { name: structure-deep, label: "Structure · deep" }
                - { name: neutral-ink, label: "Ink" }
          - { name: image, label: Image, type: image, description: "Work & doodles: the tile image. Text cards: optional image (2x1 sits right, 1x1 sits bottom-centre)." }
          - { name: alt, label: Image description (alt text), type: string }
          - { name: link, label: Link (work and text cards), type: string }
