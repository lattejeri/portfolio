# Pages CMS configuration — https://pagescms.org/docs/configuration/
media:
  input: public/media
  output: /portfolio/media # must match `base` in astro.config.mjs

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text }
      - { name: date, label: Date, type: date, required: true }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: body, label: Body, type: rich-text }

  - name: work
    label: Work
    type: collection
    path: src/content/work
    filename: "{primary}.md"
    view:
      fields: [title, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: byline, label: Byline, type: text, description: "Links: [text](https://url)" }
      - { name: draft, label: Draft, type: boolean, default: false }
      - name: blocks
        label: Blocks
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text (800 wide)
            fields:
              - name: body
                label: Text
                type: rich-text
                options:
                  format: html
          - name: image
            label: Full-width image
            fields:
              - { name: src, label: Image, type: image, required: true }
              - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners + border, type: boolean, default: false }
          - name: imageInline
            label: Image (800 wide, with text)
            fields:
              - { name: src, label: Image, type: image, required: true }
              - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners + border, type: boolean, default: false }
          - name: imageWide
            label: Image (wide, max 1200)
            fields:
              - { name: src, label: Image, type: image, required: true }
              - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners + border, type: boolean, default: false }
          - name: columns2
            label: 2-column images
            fields:
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners + border, type: boolean, default: false }
          - name: columns3
            label: 3-column images
            fields:
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners + border, type: boolean, default: false }
          - name: carousel
            label: Carousel (swipe through images)
            fields:
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Image description (alt text), type: string }
              - { name: framed, label: Rounded corners + border, type: boolean, default: false }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: title, label: Site title, type: string, required: true }
      - { name: description, label: Description, type: string }
      - { name: intro, label: Homepage title, type: text }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: byline, label: Homepage byline, type: text, description: "Links: [text](https://url)" }

  - name: grid
    label: Homepage grid
    type: file
    path: src/data/grid.json
    format: json
    fields:
      - name: items
        label: Tiles
        type: object
        list: true
        fields:
          - name: kind
            label: Kind
            type: select
            required: true
            default: work
            options:
              values: [work, doodle, text]
          - name: size
            label: Size (columns x rows)
            type: select
            description: Doodles are always 2x1. Text cards are 1x1 or 2x1.
            default: 1x1
            options:
              values: [1x1, 2x1, 2x2]
          - { name: title, label: Title, type: string }
          - { name: text, label: Card text (text cards only), type: text }
          - { name: icon, label: Icon (text cards only, 48×48), type: image }
          - { name: image, label: Image, type: image, description: "Work & doodles: the tile image. Text cards: optional image (2x1 sits right, 1x1 sits bottom-centre)." }
          - { name: alt, label: Image description (alt text), type: string }
          - { name: link, label: Link (work and text cards), type: string }
